name: Bug report
description: Report a problem with tinymcp or the reference server
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check [docs/QUICKSTART.md](https://github.com/kioie/tiny-go-mcp-server/blob/main/docs/QUICKSTART.md) and [SYSTEM_PROMPT.md](https://github.com/kioie/tiny-go-mcp-server/blob/main/SYSTEM_PROMPT.md) for API conventions.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected vs what you saw.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal code or commands, tinymcp/go-sdk versions if known.
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - streamable HTTP
        - legacy SSE
        - library only (no server run)
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tinymcp version
      description: e.g. v1.1.3 or commit SHA
      placeholder: v1.1.3
    validations:
      required: false
