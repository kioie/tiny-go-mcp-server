# Fly.io deploy for examples/http-deploy — run from repository root:
#   fly deploy --config fly.http.toml
app = 'tiny-go-mcp-http'
primary_region = 'lhr'

[build]
  dockerfile = 'examples/http-deploy/Dockerfile'

[env]
  TINY_GO_MCP_VERBOSE = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
